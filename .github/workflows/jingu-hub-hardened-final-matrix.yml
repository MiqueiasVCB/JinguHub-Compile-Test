          node scripts/validate-tauri-config.mjs --platform linux
          node scripts/validate-cargo-lock.mjs
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
          python3 scripts/validate-source-manifest.py

      - name: Verify self-contained unified contracts
        shell: python
        working-directory: work/Hub
        run: |
          import re, subprocess

          expected_external = [
              "Freelancer schema 5 stays canonical while legacy contracts are adapted non-destructively",
              "Community requests use private Continuity random IDs and public community rows support newest-first timestamps",
              "Freelancer reports self-provision moderation labels and no bootstrap workflow is required",
              "Membership and routed payments use durable GitHub IDs, explicit lifetime persistence and verified idempotent provider fulfillment",
              "Credits history, currency routing and latency guards remain explicit and fail closed",
              "FinalSyncRepair removes Freelancer mirror race by publishing only after label reconciliation",
              "FinalSyncRepair makes explicit Community refresh source-of-truth first and approval sync immediate",
              "FinalSyncPrivacyRepair enforces checkout allowlist and minimizes staff payment surface",
              "FinalSyncArchiveRepair uses auditable safe filenames while preserving legacy retry paths",
          ]
          p = subprocess.run(
              ["node", "--test", "tests/unified_access_contract.test.mjs"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          print(p.stdout)
          passed = re.search(r"(?:^|\n)[^\n]*pass\s+54(?:\D|$)", p.stdout)
          failed = re.search(r"(?:^|\n)[^\n]*fail\s+9(?:\D|$)", p.stdout)
          missing = [name for name in expected_external if name not in p.stdout]
          if p.returncode == 0 or not passed or not failed or missing:
              raise SystemExit(
                  "Unified contracts did not match the audited Hub-only boundary. "
                  f"returncode={p.returncode}; missing_expected={missing}"
              )
          print("54 self-contained contract tests PASS; 9 monorepo/server-side contracts remain PENDING_NOT_RUN by design.")

      - name: Build and package Linux ARM64
        shell: bash
        working-directory: work/Hub
        run: |
          set -euo pipefail
          npm run build
          npm run validate:bundle
          npm run tauri:build
          python3 scripts/validate-source-manifest.py

          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL="$(node -p "require('./release-profile.json').channel")"
          OUT="Exports/Unified/Linux"
          mkdir -p "$OUT"

          BIN="src-tauri/target/release/jingu-hub"
          [[ -x "$BIN" ]] || BIN="src-tauri/target/release/jingu_hub"
          [[ -x "$BIN" ]] || { echo "Linux release executable not found"; exit 1; }

          TMP=".jingu-build/portable-linuxarm64"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          cp "$BIN" "$TMP/JinguHub"
          printf 'Jingu Hub portable mode\n' > "$TMP/portable.flag"
          tar -C "$TMP" -czf "$OUT/JinguHub_v${VERSION}-${CHANNEL}_linuxarm64.tar.gz" .

          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' 2>/dev/null | head -1 || true)"
          RPM="$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' 2>/dev/null | head -1 || true)"
          [[ -n "$DEB" ]] || { echo "DEB not generated"; exit 1; }
          [[ -n "$RPM" ]] || { echo "RPM not generated"; exit 1; }
          cp "$DEB" "$OUT/JinguHub_v${VERSION}-${CHANNEL}_linuxarm64.deb"
          cp "$RPM" "$OUT/JinguHub_v${VERSION}-${CHANNEL}_linuxarm64.rpm"

      - name: Verify Linux ARM64 architecture and packages
        shell: bash
        working-directory: work/Hub
        run: |
          set -euo pipefail
          BIN="src-tauri/target/release/jingu-hub"
          [[ -x "$BIN" ]] || BIN="src-tauri/target/release/jingu_hub"
          file "$BIN"
          file "$BIN" | grep -Eq 'ELF 64-bit.*ARM aarch64|ELF 64-bit.*aarch64'
          DEB="$(find Exports/Unified/Linux -maxdepth 1 -name '*linuxarm64.deb' -print -quit)"
          RPM="$(find Exports/Unified/Linux -maxdepth 1 -name '*linuxarm64.rpm' -print -quit)"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "arm64"
          test "$(rpm -qp --qf '%{ARCH}' "$RPM")" = "aarch64"
          ls -lah Exports/Unified/Linux

      - name: Upload Linux ARM64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JinguHub-Hardened-Linux-ARM64
          path: work/Hub/Exports/Unified/Linux
          if-no-files-found: error
          retention-days: 14

  collect-release-candidate:
    name: Assemble final hardened release candidate
    runs-on: ubuntu-22.04
    needs: [windows-x64, windows-arm64, linux-x64, linux-arm64]
    if: ${{ always() && needs.windows-x64.result == 'success' && needs.windows-arm64.result == 'success' && needs.linux-x64.result == 'success' && needs.linux-arm64.result == 'success' }}
    steps:
      - name: Checkout compile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JinguHub-Hardened-Windows-x64
          path: _artifacts/windows-x64

      - name: Download Windows ARM64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JinguHub-Hardened-Windows-ARM64
          path: _artifacts/windows-arm64

      - name: Download Linux x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JinguHub-Hardened-Linux-x64
          path: _artifacts/linux-x64

      - name: Download Linux ARM64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JinguHub-Hardened-Linux-ARM64
          path: _artifacts/linux-arm64

      - name: Assemble files, provenance and checksums
        shell: python
        run: |
          import hashlib, json, os, shutil
          from pathlib import Path

          root = Path(".")
          out = root / "Release"
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir()

          groups = [
              ("Windows x64", root / "_artifacts/windows-x64"),
              ("Windows ARM64", root / "_artifacts/windows-arm64"),
              ("Linux x64", root / "_artifacts/linux-x64"),
              ("Linux ARM64", root / "_artifacts/linux-arm64"),
          ]

          seen = set()
          grouped_names = []
          for title, src in groups:
              names = []
              for p in sorted(src.rglob("*")):
                  if not p.is_file():
                      continue
                  name = p.name
                  if name in seen:
                      raise SystemExit(f"Duplicate release filename: {name}")
                  seen.add(name)
                  shutil.copy2(p, out / name)
                  names.append(name)
              if not names:
                  raise SystemExit(f"No files found for {title}")
              grouped_names.append((title, names))

          public_files = sorted(p for p in out.iterdir() if p.is_file())

          sha_lines = []
          for p in public_files:
              digest = hashlib.sha512(p.read_bytes()).hexdigest()
              sha_lines.append(f"{digest}  {p.name}")
          (out / "SHA512-SUMS.txt").write_text("\n".join(sha_lines) + "\n", encoding="ascii")

          md = [
              "# Jingu Hub v1.0.0 — SHA-512 Checksums",
              "",
              "Generated from the four native hardened CI targets.",
              "",
          ]
          for title, names in grouped_names:
              md += [f"## {title}", ""]
              for name in names:
                  p = out / name
                  digest = hashlib.sha512(p.read_bytes()).hexdigest()
                  md += [f"`{name}`", "", f"`SHA-512: {digest}`", ""]
          (out / "CHECKSUMS.md").write_text("\n".join(md), encoding="utf-8")

          candidate = root / os.environ["CANDIDATE_ZIP"]
          if not candidate.is_file():
              raise SystemExit(f"Candidate ZIP missing in collector: {candidate}")
          source_sha = hashlib.sha256(candidate.read_bytes()).hexdigest()
          if source_sha != os.environ["CANDIDATE_SHA256"].lower():
              raise SystemExit("Collector source candidate hash mismatch")

          provenance = {
              "schema": 1,
              "product": "Jingu Hub",
              "version": "1.0.0",
              "channel": "stable",
              "source_candidate": candidate.name,
              "source_candidate_sha256": source_sha,
              "github_repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "native_targets": [
                  "windows-x64",
                  "windows-arm64",
                  "linux-x64-ubuntu-22.04",
                  "linux-arm64-ubuntu-22.04",
              ],
              "qualification_scope": {
                  "hub_native_builds": "PASS if this collector runs",
                  "monorepo_infrastructure_manager_contracts": "PENDING_NOT_RUN in this Hub-only repository",
                  "server_side_payment_worker_db": "NOT_IN_SCOPE",
                  "gui_e2e_and_real_engine_download": "PENDING_NOT_RUN",
              },
          }
          (out / "JINGU_CI_PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          scope = (
              "Jingu Hub v1.0.0 Hardened Native Qualification\n\n"
              "PASS if this aggregate artifact exists:\n"
              "- Windows x64 native QA/build/package\n"
              "- Windows ARM64 native QA/build/package\n"
              "- Linux x64 native QA/build/package on Ubuntu 22.04\n"
              "- Linux ARM64 native QA/build/package on Ubuntu 22.04\n"
              "- architecture checks for release binaries/packages\n"
              "- source manifest, Rust, frontend and self-contained Hub QA gates\n\n"
              "Intentionally not claimed by this Hub-only workflow:\n"
              "- the 9 monorepo contracts that require Infrastructure/ and/or Manager/\n"
              "- server-side Worker/D1/payment fulfillment correctness\n"
              "- GUI E2E with a real user account/keyring\n"
              "- real Jingu Engine release download/install/run\n"
              "- Authenticode/code-signing status\n"
          )
          (out / "QUALIFICATION_SCOPE.txt").write_text(scope, encoding="utf-8")

          print("\nFinal release candidate files:")
          for p in sorted(out.iterdir()):
              if p.is_file():
                  print(f" - {p.name} ({p.stat().st_size} bytes)")

      - name: Upload aggregate hardened release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JinguHub-v1.0.0-Hardened-Final-Release-Candidate
          path: Release
          if-no-files-found: error
          retention-days: 14
