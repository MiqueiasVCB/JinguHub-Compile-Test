name: Jingu Hub v1.0.0 Hardened Final Native Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_ZIP: JinguHub_v1.0.0_RELEASE_HARDENED_CANDIDATE.zip
  CANDIDATE_SHA256: 58ca72b11d3c14b3b5ce99471ffeed0cbee395dd4ab1b9ceb9b90b8fb0616425
  NODE_VERSION: "22"
  RUST_VERSION: "1.97.1"

jobs:
  windows-x64:
    name: Windows x64 · Hardened native qualification
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout compile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and extract hardened candidate
        shell: python
        run: |
          import hashlib, os, shutil, sys, zipfile
          from pathlib import Path

          zpath = Path(os.environ["CANDIDATE_ZIP"])
          expected = os.environ["CANDIDATE_SHA256"].lower()
          if not zpath.is_file():
              raise SystemExit(f"Candidate ZIP not found: {zpath}")

          actual = hashlib.sha256(zpath.read_bytes()).hexdigest()
          print("candidate sha256 =", actual)
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: expected {expected}, got {actual}")

          out = Path("work")
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir()

          with zipfile.ZipFile(zpath) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = [p for p in name.split("/") if p not in ("", ".")]
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
              zf.extractall(out)

          hub = out / "Hub"
          if not (hub / "package.json").is_file():
              raise SystemExit("Hub/package.json missing after extraction")
          print("Hardened candidate extracted to", hub)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: work/Hub/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: work/Hub/src-tauri -> target

      - name: Self-contained Hub QA
        shell: powershell
        working-directory: work/Hub
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/validate-source-manifest.py
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run validate:i18n
          npm run test:frontend-domain
          npm run typecheck
          python scripts/validate-project-layout.py --root ..
          python scripts/validate-source-headers.py
          node scripts/validate-tauri-config.mjs --platform win32
          node scripts/validate-cargo-lock.mjs
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
          python scripts/validate-source-manifest.py

      - name: Verify self-contained unified contracts
        shell: python
        working-directory: work/Hub
        run: |
          import re, subprocess, sys

          expected_external = [
              "Freelancer schema 5 stays canonical while legacy contracts are adapted non-destructively",
              "Community requests use private Continuity random IDs and public community rows support newest-first timestamps",
              "Freelancer reports self-provision moderation labels and no bootstrap workflow is required",
              "Membership and routed payments use durable GitHub IDs, explicit lifetime persistence and verified idempotent provider fulfillment",
              "Credits history, currency routing and latency guards remain explicit and fail closed",
              "FinalSyncRepair removes Freelancer mirror race by publishing only after label reconciliation",
              "FinalSyncRepair makes explicit Community refresh source-of-truth first and approval sync immediate",
              "FinalSyncPrivacyRepair enforces checkout allowlist and minimizes staff payment surface",
              "FinalSyncArchiveRepair uses auditable safe filenames while preserving legacy retry paths",
          ]

          p = subprocess.run(
              ["node", "--test", "tests/unified_access_contract.test.mjs"],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          print(p.stdout)

          passed = re.search(r"(?:^|\n)[^\n]*pass\s+54(?:\D|$)", p.stdout)
          failed = re.search(r"(?:^|\n)[^\n]*fail\s+9(?:\D|$)", p.stdout)
          missing = [name for name in expected_external if name not in p.stdout]
          if p.returncode == 0 or not passed or not failed or missing:
              raise SystemExit(
                  "Unified contracts did not match the audited Hub-only boundary. "
                  f"returncode={p.returncode}; missing_expected={missing}"
              )
          print("54 self-contained contract tests PASS; 9 monorepo/server-side contracts remain PENDING_NOT_RUN by design.")

      - name: Build Windows x64 packages
        shell: powershell
        working-directory: work/Hub
        run: |
          $ErrorActionPreference = "Stop"
          .\build-hub-windows.ps1 -Clean -LogPath ".\build-hub-final.log"
          python scripts/validate-source-manifest.py

      - name: Verify Windows x64 binary architecture
        shell: python
        working-directory: work/Hub
        run: |
          import struct, zipfile
          from pathlib import Path

          def pe_machine(data: bytes) -> int:
              if data[:2] != b"MZ":
                  raise SystemExit("Missing MZ header")
              off = struct.unpack_from("<I", data, 0x3C)[0]
              if data[off:off+4] != b"PE\0\0":
                  raise SystemExit("Missing PE header")
              return struct.unpack_from("<H", data, off + 4)[0]

          exe = Path("src-tauri/target/release/jingu-hub.exe")
          if not exe.is_file():
              exe = Path("src-tauri/target/release/jingu_hub.exe")
          if pe_machine(exe.read_bytes()) != 0x8664:
              raise SystemExit("Release binary is not Windows x64")

          zips = sorted(Path("Exports/Unified/Windows").glob("*win64.zip"))
          setups = sorted(Path("Exports/Unified/Windows").glob("*win64-setup.exe"))
          if len(zips) != 1 or len(setups) != 1:
              raise SystemExit(f"Expected one win64 portable ZIP and one setup; got zips={zips}, setups={setups}")

          with zipfile.ZipFile(zips[0]) as zf:
              data = zf.read("JinguHub.exe")
          if pe_machine(data) != 0x8664:
              raise SystemExit("Portable JinguHub.exe is not Windows x64")
          print("Windows x64 architecture verified.")

      - name: Upload Windows x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JinguHub-Hardened-Windows-x64
          path: work/Hub/Exports/Unified/Windows
          if-no-files-found: error
          retention-days: 14

