              zf.extractall(out)

          if not (out / "Hub" / "package.json").is_file():
              raise SystemExit("Hub/package.json missing after extraction")

      - name: Install Linux/Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: work/Hub/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: work/Hub/src-tauri -> target

      - name: Self-contained Hub QA
        shell: bash
        working-directory: work/Hub
        run: |
          set -euo pipefail
          python3 scripts/validate-source-manifest.py
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run validate:i18n
          npm run test:frontend-domain
          npm run typecheck
          python3 scripts/validate-project-layout.py --root ..
          python3 scripts/validate-source-headers.py
          node scripts/validate-tauri-config.mjs --platform linux
          node scripts/validate-cargo-lock.mjs
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
          python3 scripts/validate-source-manifest.py

      - name: Verify self-contained unified contracts
        shell: python
        working-directory: work/Hub
        run: |
          import re, subprocess

          expected_external = [
              "Freelancer schema 5 stays canonical while legacy contracts are adapted non-destructively",
              "Community requests use private Continuity random IDs and public community rows support newest-first timestamps",
              "Freelancer reports self-provision moderation labels and no bootstrap workflow is required",
