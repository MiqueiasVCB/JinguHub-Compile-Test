  linux-x64:
    name: Linux x64 · Hardened native qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout compile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
